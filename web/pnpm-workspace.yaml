# postinstall を実行しない依存。どれもネイティブバイナリの確認・フォールバック取得だけで、
# pnpm が platform ごとの optional 依存 (esbuild は @esbuild/<platform>、@swc/core は @swc/core-<platform>) を入れるので不要。
# esbuild と @swc/core は @serwist/turbopack (Service Worker のビルド) が使う
ignoredBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver

# Dependabot は cooldown (公開から一定期間) を pnpm の minimumReleaseAge として渡してくる。
# 範囲を満たすのが「公開直後の版」だけになると解決に失敗し、その回の npm 更新がまとめて落ちるため、
# 更新の追従を優先したいパッケージはここで除外する (minimumReleaseAge を使わない通常の install では無効)。
minimumReleaseAgeExclude:
  - shadcn
