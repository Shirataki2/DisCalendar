[package]
name = "discalendar-api"
version = "3.2.1"
description = "DisCalendar REST API (events / guild settings)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "discalendar-api"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4.14", default-features = false, features = ["macros", "cookies", "compress-gzip"] }
tokio.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
reqwest.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 既定機能の emit_event_on_error は切る (#110)。有効だと ApiError の 4xx / 5xx に対して
# ミドルウェアがもう 1 行 WARN / ERROR を出し、5xx が ApiError::error_response のログと合わせて
# ERROR 2 行 = Sentry のイベント 2 件になる (#17)。エラーの内容はリクエスト完了ログの error に載る
tracing-actix-web = { version = "0.7", default-features = false }
dotenvy.workspace = true
sentry.workspace = true
# ハンドラのエラー (500 系) を Sentry に送るミドルウェア。リクエストごとの Hub も張るので一番外側に wrap する
sentry-actix = "0.49"
futures-util = { version = "0.3", default-features = false }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
moka = { version = "0.12", features = ["future"] }
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-actix-web = "0.1"
utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
