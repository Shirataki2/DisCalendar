[package]
name = "discalendar-support-bot"
version = "3.31.1"
description = "DisCalendar サポートサーバー専用の Discord Bot (問い合わせの記録・未返信のリマインド・日次まとめ)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "discalendar-support-bot"
path = "src/main.rs"

# サポートの記録を Claude から読む読み取り専用の MCP サーバー (stdio、#425)。手元で動かすだけで、イメージには入れない
[[bin]]
name = "discalendar-support-mcp"
path = "src/bin/discalendar-support-mcp.rs"

[dependencies]
# poise 0.6 は serenity 0.12 に対応。serenity の型は poise::serenity_prelude 経由で使う
poise = "0.6"
# io-std / io-util は MCP サーバーの stdio 用
tokio = { workspace = true, features = ["sync", "io-std", "io-util"] }
sqlx.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
sentry.workspace = true
