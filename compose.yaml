# web / api / bot / db をまとめて動かす compose。設定値はルートの .env から読む (.env.example をコピー)。
#   docker compose build            # 各 Dockerfile からイメージを作る (web/Dockerfile, api/Dockerfile, bot/Dockerfile)
#   docker compose up -d            # db + api + web。web は http://localhost:${WEB_PORT:-3000}
#   docker compose --profile bot up -d   # bot も起動する (下の注意を読むこと)
#   docker compose --profile logging up -d   # ログを Grafana Cloud に送る alloy も起動する (#104)
# イメージ名は GHCR に push するときの名前に合わせてある (IMAGE_TAG 既定 latest)。
# ステージング / 本番ではこのファイルを pull 先として使い、差分は compose.override.yaml や環境変数で与える。

name: discalendar

# コンテナログのローテーション (#17)。既定の json-file ドライバはローテーションしないので、
# 放っておくと再起動ループなどでログがディスクを埋める。全サービス共通で 10MB × 3 世代に抑える。
# ここから溢れた分を追う手段がエラー監視 (Sentry) と、下の alloy による Grafana Cloud への集約 (#104)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: discalendar
      # 各サービスの DATABASE_URL にそのまま埋め込む (URL エンコードされない) ので英数字のみにする (.env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: discalendar
    volumes:
      # postgres:18 以降の公式イメージはデータの親ディレクトリ (/var/lib/postgresql) をボリュームにする
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "discalendar", "-d", "discalendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/shirataki2/discalendar-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api/Dockerfile
      # 管理コンソール (/admin) に出すビルド情報。実行ファイルに焼き込まれるので build 時に渡す (#37)。
      # 未設定なら「不明」と表示されるだけ (ローカルの build では気にしなくてよい)
      args:
        GIT_SHA: ${GIT_SHA:-}
        IMAGE_TAG: ${IMAGE_TAG:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgres://discalendar:${POSTGRES_PASSWORD}@db:5432/discalendar
      DATABASE_MAX_CONNECTIONS: ${API_DATABASE_MAX_CONNECTIONS:-5}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      AUTH_COOKIE_PREFIX: better-auth
      # Discord スケジュールイベントの「場所」に入れるリンクの起点 (#94)。
      # staging では web と同じく staging のドメインにする
      SITE_BASE_URL: ${NEXT_PUBLIC_SITE_URL:-https://discalendar.app}
      # 管理コンソール (/admin) を使える Discord ユーザー ID (カンマ区切り)。空なら無効
      ADMIN_DISCORD_USER_IDS: ${ADMIN_DISCORD_USER_IDS:-}
      RUST_LOG: ${API_RUST_LOG:-info,discalendar_api=info,sqlx=warn}
      # ログの形式 (#104)。json だと 1 行 1 JSON になり、alloy がレベルを取り出して Loki のラベルにできる。
      # ローカルで docker compose logs を人が読むときは .env で LOG_FORMAT=text にする
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # エラー監視 (#17)。DSN 未設定なら何も送らない。SENTRY_ENVIRONMENT は staging では staging にする。
      # SENTRY_SAMPLE_RATE (0.0〜1.0、既定 1.0) はエラーの急増で無料枠を使い切りそうなときの逃し弁
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1.0}
    # 起動時のマイグレーション適用が終わって待ち受けを始めたら healthy になる (bot はそれを待つ)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    # OGP などの絶対 URL は next build 時に焼き込まれる (#87) ので、staging では staging のドメインを
    # 焼き込んだ別ビルド (<IMAGE_TAG>-staging) を使う。デプロイ (.github/scripts/deploy.sh) が .env に書く。
    # 本番とローカルでは IMAGE_TAG と同じ (本番ドメインを焼き込んだ既定のビルド)
    image: ghcr.io/shirataki2/discalendar-web:${WEB_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: ./web
      # rewrites の宛先と OGP の絶対 URL はビルド時に決まる (web/Dockerfile)
      args:
        # ブラウザから見たこのサイトの URL。OGP などの絶対 URL に使う。
        # staging のように別ドメインで出すときだけ .env で設定する
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://discalendar.app}
        # ブラウザ側のエラー監視 (#17)。DSN は next build 時に焼き込まれる。
        # GHCR のイメージはデプロイ CI (deploy-staging.yml) が Repository variable から渡す
        NEXT_PUBLIC_SENTRY_DSN: ${WEB_SENTRY_DSN:-}
        # rewrites の宛先。サービス名 api のままなら指定不要
        # API_URL: http://api:8080
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      # 既定では loopback にだけ公開する (Cloudflare Tunnel 経由で公開する staging でホストのポートを開けないため)。
      # LAN の別端末から見たいときは .env で WEB_BIND=0.0.0.0
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://discalendar:${POSTGRES_PASSWORD}@db:5432/discalendar
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # ブラウザから見た URL。Discord Developer Portal の Redirects に <BETTER_AUTH_URL>/api/auth/callback/discord を登録する。
      # 未設定なら公開ポート (WEB_PORT) に合わせた http://localhost:<WEB_PORT>。ドメインで公開するときは .env で明示する
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${WEB_PORT:-3000}}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      DISCORD_BOT_INVITE_URL: ${DISCORD_BOT_INVITE_URL:-}
      # 支援ページの飛び先 (Stripe Payment Links)。未設定なら /donation/checkout は 503「準備中」
      STRIPE_DONATION_PAYMENT_LINK_URL: ${STRIPE_DONATION_PAYMENT_LINK_URL:-}
      # 起動時に Better Auth のテーブルを作成・更新する (web/src/instrumentation.ts)
      AUTO_MIGRATE: "true"
      # Next.js サーバー側のエラー監視 (#17)。DSN 未設定なら何も送らない
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 注意: Bot は起動するとトークンのアプリとして Discord に接続し、参加中の全サーバーに対して
  # 予定の通知 / presence / アイコン更新を行う。同じトークンの Bot (旧版を含む) が別の場所で動いていると
  # 通知が二重に届くので、ローカルで試すときはテスト用の Discord アプリのトークンを使うこと。
  # 既定では起動せず、--profile bot を付けたときだけ起動する
  bot:
    image: ghcr.io/shirataki2/discalendar-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    profiles: ["bot"]
    depends_on:
      # マイグレーションは api が適用するので、api が healthy (= 適用済みで待ち受け中) になってから起動する
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://discalendar:${POSTGRES_PASSWORD}@db:5432/discalendar
      DATABASE_MAX_CONNECTIONS: ${BOT_DATABASE_MAX_CONNECTIONS:-5}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      BOT_LOG_CHANNEL_ID: ${BOT_LOG_CHANNEL_ID:-}
      DISCORD_BOT_INVITE_URL: ${DISCORD_BOT_INVITE_URL:-}
      BOT_SUPPORT_GUILD_ID: ${BOT_SUPPORT_GUILD_ID:-}
      SITE_BASE_URL: ${NEXT_PUBLIC_SITE_URL:-https://discalendar.app}
      RUST_LOG: ${BOT_RUST_LOG:-info,discalendar_bot=info,sqlx=warn}
      # ログの形式 (#104)。api と同じ (LOG_FORMAT=text で人が読む形式に戻せる)
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # エラー監視 (#17)。DSN 未設定なら何も送らない
      SENTRY_DSN: ${BOT_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1.0}

  # Cloudflare Tunnel でホストのポートを開けずに公開する (staging.discalendar.app など)。
  # Cloudflare Zero Trust で Tunnel を作り、Public Hostname の Service を http://web:3000 に向け、
  # トークンを .env の TUNNEL_TOKEN に入れる。--profile tunnel (または .env の COMPOSE_PROFILES) で起動する
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default-logging
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_started

  # 各サービスのコンテナログを Grafana Cloud (Loki) に送るエージェント (#104)。
  # 送る内容とラベルは infra/alloy/config.alloy に書いてある (デプロイのたびに compose.yaml と一緒に配られる)。
  # Grafana Cloud のアクセスポリシートークンを .env に入れ、--profile logging (または .env の COMPOSE_PROFILES) で起動する。
  # 未設定のまま起動すると送信先が空でエラーになるので、トークンを用意してから profile を足すこと
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    logging: *default-logging
    profiles: ["logging"]
    # docker.sock (root:docker 0660) を読むために root で動かす。ホストの docker グループ ID は
    # OS ごとに違い、group_add だと環境ごとの設定が増えるため。docker API が読める時点でホストと
    # 同等の権限になるので、収集対象は下の COMPOSE_PROJECT で自分の compose プロジェクトだけに絞ってある
    user: root
    command:
      - run
      # 待ち受けは compose のネットワーク内だけ (ports で公開しない)。設定やパイプラインの状態を UI で
      # 見たいときだけ、一時的に ports: ["127.0.0.1:12345:12345"] を足して http://localhost:12345 を開く
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # どこまで送ったかの記録。消すと再起動時に古いログを送り直す
      - alloy-data:/var/lib/alloy/data
    environment:
      # 収集対象を絞る compose プロジェクト名 (COMPOSE_PROJECT_NAME 未設定ならこのファイルの name)
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-discalendar}
      # ラベル env の値。Sentry と画面を突き合わせやすいよう同じ変数を使う
      LOG_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Grafana Cloud の Loki (スタックの詳細に出る Push URL と User、トークンは logs:write のもの)
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_LOKI_TOKEN: ${GRAFANA_CLOUD_LOKI_TOKEN:-}

volumes:
  db-data:
  alloy-data:
