[package]
name = "discalendar-bot"
version = "3.1.0"
description = "DisCalendar Discord Bot (guild registration / slash commands / notifications)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "discalendar-bot"
path = "src/main.rs"

[dependencies]
# poise 0.6 は serenity 0.12 に対応。serenity の型は poise::serenity_prelude 経由で使う
poise = "0.6"
# sync: reconcile と upsert の直列化に tokio::sync::RwLock を使う
tokio = { workspace = true, features = ["sync"] }
sqlx.workspace = true
# 予定の日時 (タイムゾーンなしの JST) と現在時刻
chrono.workspace = true
# 通知設定の DB 保存形式 (旧 Web / 旧 Bot と同じ JSON 文字列) の読み書き
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
sentry.workspace = true
# icon_updater タスクの祝日判定 (依存ゼロの純 Rust 実装)
jpholiday = "0.2"
