# Rust 側 (api / bot) のワークスペース。web は pnpm で別管理。
[workspace]
resolver = "3"
members = ["api", "bot"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
# api / bot で共有する依存はここでバージョンを一元管理する
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
sqlx = { version = "0.9", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "chrono",
  # admin_audit_logs の JSONB カラム (serde_json::Value) 用
  "json",
  "macros",
  "migrate",
] }
serde = { version = "1", features = ["derive"] }
# arbitrary_precision: events.notifications (JSONB) に PostgreSQL では有効でも f64 では表せない
# 数値 (1e400 など) が手作業で入っても Value として読めるようにする。既定の Value は数値を f64 で
# 持つため、そこで sqlx のデコードごと失敗し、1 行のせいで予定一覧や Bot の通知タスクが
# まるごと落ちる (要素単位で無視する decode_all まで処理が届かない)
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
# エラー監視 (#17)。SENTRY_DSN が未設定なら何も送らない。
# 実行イメージ (debian slim) に OpenSSL が無いので既定の native-tls ではなく rustls で送る。
# "tracing" は sentry::integrations::tracing (ERROR をイベント、WARN 以下をパンくずとして送る layer)
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "release-health",
  "reqwest",
  "rustls",
  "tracing",
] }

[profile.release]
lto = "thin"
codegen-units = 1
# シンボル名は Sentry のバックトレースの関数名表示に要るので残し、デバッグ情報だけ削る (#17)
strip = "debuginfo"
