name: 不具合報告
description: 期待どおりに動かない箇所を報告する
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたかを簡潔に
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. /dashboard/<サーバー> を開く
        2. 予定をドラッグして別の日に移動する
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージ、スクリーンショット、ブラウザのコンソールやサーバーのログがあれば貼る (トークンなどの秘密情報は伏せる)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 発生箇所
      multiple: true
      options:
        - web (Next.js)
        - api (Rust)
        - bot
        - 不明
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 環境
      description: ブラウザ / OS / 端末など (web の不具合の場合)
      placeholder: "例: Chrome 140 / macOS 15、iPhone の Safari"
