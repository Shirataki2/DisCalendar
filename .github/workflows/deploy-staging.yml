# main にマージされたら web / api / bot のイメージを GHCR に push し、staging ホスト (Tailnet 内) に反映する (#26)。
# 手順: build (GHCR へ sha-<short sha> と staging タグで push) → deploy (tailscale/github-action で Tailnet に参加 →
# ssh で compose.yaml を配り、docker compose pull && up -d → healthy になるまで待つ)。
# ロールバック: Actions の "Run workflow" で image_tag に過去の sha-xxxxxxx を指定する (ビルドは飛ばして deploy だけ行う)。
# 手動実行も main 以外の ref では動かさない (別ブランチの deploy.sh をホストに流し込めないようにする。
# Environment "staging" の Deployment branches も main だけに制限しておくこと)。
# 必要な設定 (Environment "staging"): secrets TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET (Tailscale の OAuth クライアント、tag:ci)、
#   STAGING_SSH_HOST (Tailnet 上のホスト名か 100.x の IP) / STAGING_SSH_USER / STAGING_SSH_KEY (Tailscale SSH を使うなら不要)。
#   vars STAGING_SSH_PORT (既定 22。deploy ジョブは Environment に属するので Environment / Repository どちらの variable でもよい)
# Repository variables (build ジョブは Environment に属さないので Environment variables ではなくリポジトリ側に置く):
#   STAGING_PLATFORMS (既定 linux/amd64) / STAGING_BUILD_RUNNER (既定 ubuntu-latest。arm64 ホストなら ubuntu-24.04-arm) /
#   STAGING_COMPOSE_DIR (既定 /opt/discalendar-staging) /
#   STAGING_SITE_URL (既定 https://staging.discalendar.app。web の OGP などの絶対 URL に焼き込む)。詳細は README
# 任意 (エラー監視 #17): Repository variables WEB_SENTRY_DSN (web の DSN。next build 時に焼き込む) /
#   SENTRY_ORG / SENTRY_PROJECT_WEB と、secret SENTRY_AUTH_TOKEN (ソースマップのアップロード用。
#   Sentry の組織設定で作る Organization Auth Token (sntrys_...) を使う。README 参照)。
#   未設定なら web の Sentry は無効のままビルドされる。api / bot の DSN はホスト側 .env で渡す (実行時に読む)
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "デプロイするイメージタグ (例: sha-abc1234)。空なら今のコミットからビルドして push する"
        required: false
        default: ""

# デプロイは直列にする (後から来た実行は待つ。cancel すると pull と up の途中で止まりかねない)
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.image }}${{ matrix.site && '-staging' || '' }})
    # image_tag が指定されたとき (ロールバック) はビルドしない。push イベントでは inputs は空。main 以外の ref では動かさない
    if: github.ref == 'refs/heads/main' && inputs.image_tag == ''
    # arm64 のイメージを作るときは QEMU でも動くが Rust のビルドが極端に遅いので、ネイティブの arm ランナーを使う
    # (Repository variable STAGING_BUILD_RUNNER=ubuntu-24.04-arm)
    runs-on: ${{ vars.STAGING_BUILD_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: ./web
            dockerfile: ./web/Dockerfile
          # OGP などの絶対 URL は next build 時に焼き込まれる (#87)。本番へは上の既定ビルド (本番ドメイン) を
          # そのまま配るので、staging のドメインを焼き込んだ web を sha-xxxxxxx-staging として別に作る
          - image: web
            context: ./web
            dockerfile: ./web/Dockerfile
            site: staging
          - image: api
            context: .
            dockerfile: ./api/Dockerfile
          - image: bot
            context: .
            dockerfile: ./bot/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # ランナーと違う CPU 向け (platforms) にビルドするときのために QEMU を入れる (buildx より前に置く)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # compose.yaml の image と同じ名前 (GHCR は小文字のみ)
          images: ghcr.io/shirataki2/discalendar-${{ matrix.image }}
          # staging ドメイン版の web には sha-xxxxxxx-staging だけを付ける
          # (floating な staging タグは、本番にも配る既定のビルドに付ける)
          tags: |
            type=raw,value=staging,enable=${{ !matrix.site }}
            type=sha,prefix=sha-,format=short,suffix=${{ matrix.site && '-staging' || '' }}
      # イメージごとにビルド時の値を渡す。api には管理コンソール (/admin) に出すビルド情報 (#37)、
      # web には staging のドメイン (OGP などの絶対 URL は next build 時に焼き込まれる #87) と
      # Sentry の DSN (#17。ブラウザに配る値なので next build 時に焼き込まれる) を渡す
      - name: イメージに渡す build-args を決める
        id: build_info
        env:
          IMAGE: ${{ matrix.image }}
          SITE: ${{ matrix.site }}
          SITE_URL: ${{ vars.STAGING_SITE_URL || 'https://staging.discalendar.app' }}
          # Repository variables (未設定なら Sentry は無効のままビルドされる)。DSN は秘密情報ではない
          WEB_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ vars.SENTRY_PROJECT_WEB }}
        run: |
          {
            echo "args<<ARGS_EOF"
            case "$IMAGE" in
              api)
                echo "GIT_SHA=$GITHUB_SHA"
                # metadata-action の type=sha,format=short と同じ 7 桁 (実際に push されるタグに合わせる)
                echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}"
                ;;
              web)
                # staging 版だけドメインを差し替える (既定は web/Dockerfile の本番ドメイン)
                if [ -n "$SITE" ]; then
                  echo "NEXT_PUBLIC_SITE_URL=$SITE_URL"
                fi
                echo "NEXT_PUBLIC_SENTRY_DSN=$WEB_SENTRY_DSN"
                # ソースマップのアップロード先 (secret SENTRY_AUTH_TOKEN があるときだけ使われる)
                echo "SENTRY_ORG=$SENTRY_ORG"
                echo "SENTRY_PROJECT=$SENTRY_PROJECT_WEB"
                ;;
            esac
            echo "ARGS_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.build_info.outputs.args }}
          # web のソースマップを Sentry へアップロードするための Organization Auth Token (#17)。
          # secret 未設定なら空のままで、アップロードはスキップされる (web/Dockerfile)
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ホストの CPU に合わせる (arm64 のホストなら Repository variable STAGING_PLATFORMS=linux/arm64)
          platforms: ${{ vars.STAGING_PLATFORMS || 'linux/amd64' }}
          # attestation を付けると GHCR の一覧に unknown/unknown のエントリが増えるので切る
          provenance: false
          # web は既定 / staging ドメインで 2 本ビルドするので、キャッシュも分ける
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.site && '-staging' || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}${{ matrix.site && '-staging' || '' }}

  deploy:
    name: deploy
    needs: build
    # build が skipped (image_tag 指定) でも進み、失敗したら止める。main 以外の ref では動かさない
    if: >-
      always() && github.ref == 'refs/heads/main'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.discalendar.app
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            compose.yaml
            .github/scripts/deploy.sh
          sparse-checkout-cone-mode: false
      - name: デプロイするタグを決める
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="$INPUT_TAG"
          # metadata-action の type=sha,format=short と同じ 7 桁
          [ -n "$tag" ] || tag="sha-${GITHUB_SHA:0:7}"
          # リモートのシェルに渡すので、想定する形式 (sha-<hex>) 以外は受け付けない
          if ! [[ "$tag" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "::error::image_tag must look like sha-<hex> (got: $tag)"
            exit 1
          fi
          # web は staging のドメインを焼き込んだ別ビルドを使う (#87)。この仕組みより前のタグへ戻すときは
          # -staging が無いので、その場合だけ既定のビルド (本番ドメイン) にフォールバックする
          web_tag="${tag}-staging"
          if ! docker manifest inspect "ghcr.io/shirataki2/discalendar-web:${web_tag}" > /dev/null 2>&1; then
            echo "::warning::ghcr.io/shirataki2/discalendar-web:${web_tag} が無いので ${tag} を使う (OGP は本番の URL になる)"
            web_tag="$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "web_tag=$web_tag" >> "$GITHUB_OUTPUT"
          echo "image tag: $tag"
      - name: Tailnet に参加する
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH の準備
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 鍵が設定されていればそれを使う。未設定なら Tailscale SSH (ACL の ssh ルールで tag:ci を許可) に任せる
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          fi
          # Tailnet 内 (WireGuard で相手が認証済み) なのでホスト鍵はその場で取得する
          ssh-keyscan -T 20 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: compose.yaml を配ってデプロイする
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          COMPOSE_DIR: ${{ vars.STAGING_COMPOSE_DIR || '/opt/discalendar-staging' }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          WEB_IMAGE_TAG: ${{ steps.tag.outputs.web_tag }}
        run: |
          # ssh はリモート側でもう一度シェルが解釈するので、引数は printf %q でクォートして渡す。
          # web だけは staging のドメインを焼き込んだ別ビルド (-staging) を使う (#87)
          scp -q -P "$SSH_PORT" compose.yaml "$SSH_USER@$SSH_HOST:$(printf '%q' "$COMPOSE_DIR")/compose.yaml"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$(printf '%q' "$COMPOSE_DIR")" "$(printf '%q' "$IMAGE_TAG")" \
            "$(printf '%q' "$WEB_IMAGE_TAG")" \
            < .github/scripts/deploy.sh
