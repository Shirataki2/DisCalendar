# Issue / PR のコメントで @claude と呼ぶと Claude が応答する (質問への回答、修正コミットの push、Issue からの PR 作成など)。
# 認証は claude-code-review.yml と同じ secret CLAUDE_CODE_OAUTH_TOKEN。
# write 権限を持つユーザーのコメントだけに反応し、bot のコメントは無視する (Codex との無限ループにはならない)。
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PR の CI 結果を読むため
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 必要になったら CLI 引数で調整する (例):
          # claude_args: |
          #   --max-turns 20
          #   --allowedTools "Bash(pnpm lint),Bash(pnpm exec tsc --noEmit),Bash(cargo fmt --all --check),Bash(cargo clippy:*)"
