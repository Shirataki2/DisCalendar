# v3.x.y タグを push したらリリースを確定させる (#12 の本番切替を v3.0.0 とし、以降は semver で上げる)。
# 手順: タグとリポジトリ内のバージョンの一致を確認 → そのコミットが main にあることを確認 →
#   staging へのデプロイで GHCR に push 済みの sha-<short sha> イメージに v3.x.y を付け直す (再ビルドしない) →
#   更新履歴 (web/src/content/changelog.mdx) のそのバージョンの節からリリースノートを作り、GitHub Release を公開する →
#   最後に latest ジョブが「今いちばん新しい公開済みリリース」にイメージの latest を向ける。
# 本番への反映はこのワークフローでは行わない。Actions の "Deploy production" を image_tag: v3.x.y で実行する
# (承認と「staging で確かめたものを配る」運用をそのまま残すため)。詳細は .claude/skills/release/
name: Release

on:
  push:
    tags: ["v*"]

# タグごとに分ける。全リリース共通の group にすると、短い間に 3 つ以上タグを push したときに
# GitHub Actions が待機中の 1 件しか保持せず、間のリリースが走らないまま取り消される
# (cancel-in-progress: false でも待機中の実行は後から来た実行に消される)。
# リリース同士が並走したときの latest の扱いは、最後の「latest を向け直す」ステップで担保する
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release の作成
  packages: write # GHCR のタグ付け直し

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 前回のタグを探し、そのときの更新履歴と比べるので全履歴が要る
          fetch-depth: 0
      - name: タグとバージョンを確認する
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # プレリリース (v3.1.0-rc.1) も受け付ける。ビルドメタデータ (+...) は Docker のタグに使えないので不可
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::タグの形式が v<major>.<minor>.<patch>[-<prerelease>] ではない (got: $TAG)"
            exit 1
          fi
          version="${TAG#v}"
          # web/package.json / api/Cargo.toml / bot/Cargo.toml / Cargo.lock がタグと同じ版になっているか
          .github/scripts/check-versions.sh "$version" > /dev/null
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "image_tag=sha-${GITHUB_SHA:0:7}"
            # 3.1.0-rc.1 のようにハイフンが入っていたらプレリリース扱い (latest は付けない)
            if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: main のコミットに付けたタグか確認する
        run: |
          # タグの checkout では origin/main の追跡ブランチが無いことがあるので FETCH_HEAD で見る
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::このタグのコミットは main に含まれていない。main にマージしてからタグを打ち直すこと"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR のイメージに v タグを付ける
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SRC_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          images=(web api bot)
          # 先に 3 つとも揃っているか確かめる。1 つずつ確認しながらタグを付けると、
          # 途中で失敗したときに web だけ v3.x.y が付いた状態になり、compose で新旧が混ざる
          for image in "${images[@]}"; do
            repo="ghcr.io/shirataki2/discalendar-${image}"
            # main へのマージで "Deploy staging" がビルドしたイメージを使う (ここではビルドしない)
            if ! docker buildx imagetools inspect "${repo}:${SRC_TAG}" > /dev/null 2>&1; then
              echo "::error::${repo}:${SRC_TAG} が無い。main へのマージ後の \"Deploy staging\" の完了を待ってからタグを打つこと"
              exit 1
            fi
          done

          # latest はここでは触らない (Release を公開してから最後のステップで向け直す)
          for image in "${images[@]}"; do
            repo="ghcr.io/shirataki2/discalendar-${image}"
            # マニフェストを同じ digest のままコピーする (再ビルドしないので staging で検証したものと必ず同一)
            docker buildx imagetools create -t "${repo}:${TAG}" "${repo}:${SRC_TAG}"
            echo "tagged ${repo}:${TAG} (from ${SRC_TAG})"
          done
      - name: リリースノートを作る
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SRC_TAG: ${{ steps.version.outputs.image_tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # ノート本文は更新履歴のバージョン見出し (リリース準備時に bump-version.sh が挿入) の節から作る。
          # 前回リリースは「変更点」の compare リンクにだけ使い、「GitHub Release が公開されていて、
          # このタグから辿れるタグ」のうち一番新しいものを選ぶ。git のタグ一覧 (git describe) だと、
          # 打ち間違えたタグや途中で失敗した run のタグまで前回リリース扱いになる。
          # 正式版はプレリリースを飛ばして直前の正式版と比べる
          if [ "$PRERELEASE" = "true" ]; then
            filter='select(.isDraft == false)'
          else
            filter='select(.isDraft == false and .isPrerelease == false)'
          fi
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease,isDraft --jq ".[] | ${filter} | .tagName")
          # --sort=-creatordate なので、辿れるタグを新しい順に見て最初に見つかった公開済みのものが前回リリース
          prev=""
          while read -r t; do
            if [ -z "$t" ] || [ "$t" = "$TAG" ]; then continue; fi
            if ! printf '%s\n' "$published" | grep -qxF "$t"; then continue; fi
            prev="$t"
            break
          done < <(git tag --merged "${TAG}^" --sort=-creatordate)
          echo "previous tag: ${prev:-(なし)}"
          # 正式版はタグと同じバージョンの節、プレリリースは (見出しがまだ無いので) 未リリース分を出す
          notes=$(.github/scripts/release-notes.sh "$TAG")

          # 見出しの日付は bump-version.sh が実行日 (または引数の日付) で書くので、リリース準備 PR が
          # 日をまたいでマージされると実際のリリース日とずれる。利用者に見える日付なので、ずれていたら知らせる
          # (止めはしない。見出しの日付を直すコミットを入れてタグを打ち直すかは判断に任せる)
          if [ "$PRERELEASE" != "true" ]; then
            heading=$(grep -m1 "^## ${TAG} (" web/src/content/changelog.mdx || true)
            today=$(TZ=Asia/Tokyo date '+%Y年%-m月%-d日')
            if [ -z "$heading" ]; then
              echo "::warning::更新履歴に ${TAG} のバージョン見出しが無い (bump-version.sh を通していない?)。リリースノートは「変更なし」になる"
            elif [ "$heading" != "## ${TAG} (${today})" ]; then
              echo "::warning::更新履歴の見出し「${heading}」の日付が今日 (${today}) と違う。リリース準備 PR が日をまたいだ場合は、見出しの日付を直してからタグを打ち直すことを検討する"
            fi
          fi
          {
            if [ -n "$notes" ]; then
              echo "$notes"
            else
              echo "利用者に見える変更はありません (内部の変更のみ)。"
            fi
            echo
            echo "---"
            echo
            if [ -n "$prev" ]; then
              echo "**変更点**: [\`${prev}...${TAG}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev}...${TAG})"
            fi
            echo "**イメージ**: \`ghcr.io/shirataki2/discalendar-{web,api,bot}:${TAG}\` (\`${SRC_TAG}\` と同じ digest)"
            echo "**本番への反映**: Actions の \"Deploy production\" を \`image_tag: ${TAG}\` で実行する"
          } > release-notes.md
          cat release-notes.md
      - name: GitHub Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # gh release create でタグごと作った場合など、既に Release があるなら本文を差し替える。
          # 下書き / prerelease で先に作られていることがあるので、公開状態も明示して揃える
          # (--draft=false を付けないと下書きのままになり、latest ジョブの候補から外れる)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md \
              --draft=false --prerelease="$PRERELEASE"
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            # --verify-tag: 実行中にリモートのタグが消されていたら中止する
            # (付けないと gh が default branch の先頭にタグを作り直し、Release とイメージの中身がずれる)
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag "${flags[@]}"
          fi

  # latest (compose の IMAGE_TAG 既定値) を最新の正式リリースに向ける。
  # 「自分が最新か」ではなく「今いちばん新しい公開済みリリースはどれか」を見て**そのリリースのイメージ**に
  # 向けるので、実行順が入れ替わっても最後に走った実行が正しい版に収束する (巻き戻らない)。
  # このジョブだけ全リリース共通の concurrency に入れて書き込みを直列化する。待機中が後続に取り消されても、
  # 取り消した側が同じ処理をして収束するので取りこぼしにならない
  # (release ジョブはタグごとの group なので、こちらは取り消されない)
  latest:
    name: latest
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 最新の正式リリースに latest を向ける
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 判定材料は git のタグ一覧ではなく「公開済みの GitHub Release」。打ち間違えたタグや
          # 途中で失敗した run のタグが残っていても latest が止まらない
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' | sort -V | tail -1)
          if [ -z "$newest" ]; then
            echo "::notice::公開済みの正式リリースがまだ無いので latest は動かさない"
            exit 0
          fi
          # そのリリースのタグが指すコミットから、ビルド済みイメージのタグ (sha-<short sha>) を求める
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${newest}" --jq '.sha')
          src="sha-${sha:0:7}"
          echo "latest -> ${newest} (${src})"
          for image in web api bot; do
            repo="ghcr.io/shirataki2/discalendar-${image}"
            docker buildx imagetools create -t "${repo}:latest" "${repo}:${src}"
            echo "tagged ${repo}:latest (from ${src})"
          done
