# PR が開かれた / 更新されたときに Claude が自動レビューしてインラインコメントを付ける。
# 認証は Claude サブスクリプションの OAuth トークン (`claude setup-token` で発行し、
# リポジトリの secret CLAUDE_CODE_OAUTH_TOKEN に登録)。API キーを使う場合は
# anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} に置き換える。
# レビューの観点は AGENTS.md (CLAUDE.md から参照) の「Code Review Rules」。
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同じ PR に連続で push したら前のレビューは止める
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # secret が未設定 (セットアップ前、Dependabot や fork からの PR) のときは失敗させずスキップする
  gate:
    name: gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN が未設定なので Claude のレビューをスキップしました"
          fi

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment で PR にインラインコメントを付ける (無いと実行ログにしか出ない)
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # インラインコメント用の MCP サーバーは --allowedTools に書いたときだけ起動する
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
