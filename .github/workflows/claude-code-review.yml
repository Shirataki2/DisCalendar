# PR が開かれた / 更新されたときに Claude が自動レビューしてインラインコメントを付ける。
# 認証は Claude サブスクリプションの OAuth トークン (`claude setup-token` で発行し、
# リポジトリの secret CLAUDE_CODE_OAUTH_TOKEN に登録)。API キーを使う場合は
# anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} に置き換える。
# レビューの観点は AGENTS.md (CLAUDE.md から参照) の「Code Review Rules」。
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同じ PR に連続で push したら前のレビューは止める
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # secret が未設定 (セットアップ前、Dependabot や fork からの PR) のときは失敗させずスキップする
  gate:
    name: gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN が未設定なので Claude のレビューをスキップしました"
          fi

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        env:
          # Agent (サブエージェント) を同期実行にする。Claude Code 2.1.198 以降はサブエージェントが既定で
          # バックグラウンド実行になり、ヘッドレスの action ではメインが「完了通知を待つ」と言ってターンを終えた時点で
          # セッションが終了し、レビューが最後まで走らずに green になる (anthropics/claude-code-action#1499 / #1462)
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment で PR にインラインコメントを付ける (無いと実行ログにしか出ない)
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools: Skill(code-review:code-review) は必須。SDK 経由では prompt の "/code-review:code-review" が
          #   クライアント側で展開されず、モデルが Skill ツールでプラグインを読み込もうとするため、許可がないと拒否されて
          #   プラグインの手順が一切読み込まれないまま即興のレビューになる (#19 で全文ログから確認)。
          #   そのほか、プラグイン (plugins/code-review/commands/code-review.md の allowed-tools) が使う gh コマンドに加え、
          #   エージェントが PR の取得や履歴確認に使いがちな読み取り系コマンド (git log など) と、パイプ先になる
          #   head / jq / grep なども許可する (パイプや && でつないだコマンドは各部分が許可されていないと拒否される)。
          #   ヘッドレス実行では許可外のツール呼び出しが自動で拒否される。
          #   (サブエージェントが diff をファイルに書き出そうとする `> file` は Claude Code 側の書き込み保護で弾かれるが、
          #   stdout で読み直して進むので実害はない)
          #   find は `-exec` で任意コマンドを実行でき allowlist を迂回できるので許可しない (ファイル探索は権限不要の
          #   Glob / Grep / Read を使うよう system prompt で指示)。gh api も書き込みに使えるうえ実際には使われないので許可しない
          #   インラインコメント用の MCP サーバーは --allowedTools に書いたときだけ起動する。
          # --disallowedTools: 対話セッション専用のツール。ヘッドレスでは「次のターン」が来ないので、使われると
          #   そこでレビューが止まる (anthropics/claude-code-action#1462 の回避策)
          #   なお action はこのファイルが main と同一内容のときしか動かない (PR 上では検証できない) ので、
          #   変更後は main にマージしてから別の PR の review ジョブで確認する (result の num_turns / duration_ms /
          #   modelUsage に opus が含まれるか。1 分未満・Opus なしならレビュー本体に到達していない)。
          #   やり取りの全文が必要なときだけ一時的に show_full_output: true を付ける (public リポジトリなので常用しない)
          # --append-system-prompt: プラグインの適格性チェックが Claude Code 製の PR を「自動生成 PR」と誤判定しないようにし、
          #   レビュー規約の場所 (AGENTS.md) と日本語で書くことを伝える
          claude_args: |
            --allowedTools "Skill(code-review:code-review),mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(wc:*),Bash(jq:*),Bash(cut:*),Bash(sort:*),Bash(cd:*),Bash(ls:*)"
            --disallowedTools "ScheduleWakeup,SendMessage,Monitor,TaskList,TaskOutput,CronCreate,CronDelete,CronList"
            --append-system-prompt "This is a non-interactive CI session: ending your turn terminates the entire run immediately and any background work is lost. Run the /code-review:code-review skill to completion within this turn. When launching subagents with the Agent tool, always pass run_in_background: false and wait for each result before continuing. Never schedule wakeups or end your turn while any agent is still running or before the review result (inline comments, or the no-issues comment) has been posted. Repository-specific review instructions for DisCalendar (these take precedence over the plugin's eligibility heuristics): (1) Pull requests in this repository are usually written with Claude Code (branch prefix claude/, footer 'Generated with Claude Code', Co-Authored-By: Claude). They are NOT automated PRs and MUST be fully reviewed. Skip a PR only if it is closed, a draft, or authored by dependabot. Never skip because the change looks small or trivial (CI and workflow changes must be reviewed too), and never skip because Claude already commented on an earlier commit: in that case review the newly pushed changes and do not repeat issues that were already raised. (2) The review rules are in AGENTS.md at the repository root (CLAUDE.md only imports it via @AGENTS.md). Treat AGENTS.md as the CLAUDE.md for compliance checks and give its 'Code Review Rules' section to every subagent. (3) Write every review comment in Japanese. (4) To locate or read files such as CLAUDE.md or AGENTS.md, use the Glob, Grep and Read tools instead of find or shell pipelines, and never redirect command output into files."
      # Claude のやり取りの全文 (ツールの実行結果を含む) を artifact に残す。show_full_output を常用せずに
      # 「レビューが最後まで走ったか」を後から確認するため。中身は PR の差分・コメントと AGENTS.md 程度だが
      # public リポジトリなので保持期間は短くする
      - name: Claude の実行ログを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 7
          if-no-files-found: ignore
