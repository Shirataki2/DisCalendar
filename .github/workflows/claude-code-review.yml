# PR が開かれた / 更新されたときに Claude が自動レビューしてインラインコメントを付ける。
# 認証は Claude サブスクリプションの OAuth トークン (`claude setup-token` で発行し、
# リポジトリの secret CLAUDE_CODE_OAUTH_TOKEN に登録)。API キーを使う場合は
# anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} に置き換える。
# レビューの観点は AGENTS.md (CLAUDE.md から参照) の「Code Review Rules」。
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同じ PR に連続で push したら前のレビューは止める
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # secret が未設定 (セットアップ前、Dependabot や fork からの PR) のときは失敗させずスキップする
  gate:
    name: gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN が未設定なので Claude のレビューをスキップしました"
          fi

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment で PR にインラインコメントを付ける (無いと実行ログにしか出ない)
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools: プラグイン (plugins/code-review/commands/code-review.md の allowed-tools) が使う gh コマンドを
          #   明示的に許可する。ヘッドレス実行では許可外のツール呼び出しが自動で拒否され、レビューが始まる前に
          #   終了していた (#19)。インラインコメント用の MCP サーバーは --allowedTools に書いたときだけ起動する。
          #   なお action はこのファイルが main と同一内容のときしか動かない (PR 上では検証できない) ので、
          #   変更後は main にマージしてから別の PR の review ジョブで確認する (result の num_turns / duration_ms /
          #   modelUsage に opus が含まれるか。1 分未満・Opus なしならレビュー本体に到達していない)。
          #   やり取りの全文が必要なときだけ一時的に show_full_output: true を付ける (public リポジトリなので常用しない)
          # --append-system-prompt: プラグインの適格性チェックが Claude Code 製の PR を「自動生成 PR」と誤判定しないようにし、
          #   レビュー規約の場所 (AGENTS.md) と日本語で書くことを伝える
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --append-system-prompt "Repository-specific review instructions for DisCalendar (these take precedence over the plugin's eligibility heuristics): (1) Pull requests in this repository are usually written with Claude Code (branch prefix claude/, footer 'Generated with Claude Code', Co-Authored-By: Claude). They are NOT automated PRs and MUST be fully reviewed. Skip a PR only if it is closed, a draft, or authored by dependabot. Never skip because the change looks small or trivial (CI and workflow changes must be reviewed too), and never skip because Claude already commented on an earlier commit: in that case review the newly pushed changes and do not repeat issues that were already raised. (2) The review rules are in AGENTS.md at the repository root (CLAUDE.md only imports it via @AGENTS.md). Treat AGENTS.md as the CLAUDE.md for compliance checks and give its 'Code Review Rules' section to every subagent. (3) Write every review comment in Japanese."
